<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiragana Match Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Hiragana Match Game</h1>

<div class="score">
    Score: <span id="score">0</span>/5
</div>

<div class="game">
    <div class="column">
        <h2>Hiragana</h2>
        <div id="hiraganaList"></div>
    </div>
    <div class="column">
        <h2>Romaji</h2>
        <div id="romajiList"></div>
    </div>

</div>

<button id="newGame">New Game</button>

<script src="script.js"></script>
</body>
</html>
